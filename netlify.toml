[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# /api/availability -> función que lee el calendario iCal de Booking
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
